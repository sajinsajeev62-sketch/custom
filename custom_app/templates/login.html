{% extends "base.html" %}

{% block title %}Sign in{% endblock %}

{% block content %}
  <h1>Sign in</h1>

  {% if form.errors %}
    <div class="error" role="alert">
      The username or password is incorrect. Check both and try again.
    </div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <label for="id_username">Username</label>
    <input type="text" name="username" id="id_username" autocomplete="username" autofocus required>

    <label for="id_password">Password</label>
    <input type="password" name="password" id="id_password" autocomplete="current-password" required>

    <button type="submit">Sign in</button>
  </form>
{% endblock %}
