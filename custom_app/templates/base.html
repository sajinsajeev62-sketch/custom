<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Welcome{% endblock %}</title>
  <style>
    :root {
      --bg: #eef2f6; --surface: #ffffff; --text: #1b2733; --muted: #5b6b7a;
      --accent: #1f5f8b; --accent-dark: #174a6d;
      --error-bg: #fdecea; --error-text: #8a1f17; --border: #cfd8e1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 1.5rem; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .panel {
      width: 100%; max-width: 22rem; background: var(--surface);
      border: 1px solid var(--border); border-radius: 10px; padding: 2rem;
    }
    h1 { margin: 0 0 1.25rem; font-size: 1.5rem; }
    label { display: block; margin-bottom: .35rem; font-size: .9rem; color: var(--muted); }
    input[type=text], input[type=password] {
      width: 100%; padding: .65rem .75rem; margin-bottom: 1rem;
      border: 1px solid var(--border); border-radius: 6px; font-size: 1rem;
    }
    input:focus, button:focus-visible { outline: 3px solid #8fc1e3; outline-offset: 1px; }
    button {
      width: 100%; padding: .7rem; border: 0; border-radius: 6px;
      background: var(--accent); color: #fff; font-size: 1rem; cursor: pointer;
    }
    button:hover { background: var(--accent-dark); }
    .error {
      margin-bottom: 1rem; padding: .65rem .75rem; border-radius: 6px;
      background: var(--error-bg); color: var(--error-text); font-size: .9rem;
    }
    .link-button {
      background: none; color: var(--accent); width: auto; padding: 0;
      text-decoration: underline; font-size: .95rem;
    }
    .link-button:hover { background: none; color: var(--accent-dark); }
  </style>
</head>
<body>
  <main class="panel">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
